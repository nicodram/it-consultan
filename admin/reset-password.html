<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Reset Password | NRA Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <div class="grid-overlay"></div>

  <main class="admin-auth-wrapper">
    <form id="reset-form" class="admin-auth-card glass-panel" hidden>
      <a href="../index.html" class="logo">NRA<span class="logo-dot">.</span></a>
      <h1>Buat Password Baru</h1>
      <p class="admin-auth-subtitle">Masukkan password baru untuk akun admin Anda.</p>

      <label for="password">Password Baru</label>
      <input type="password" id="password" name="password" required minlength="6" autocomplete="new-password">

      <label for="password-confirm">Ulangi Password Baru</label>
      <input type="password" id="password-confirm" name="password-confirm" required minlength="6" autocomplete="new-password">

      <p id="reset-error" class="admin-error" hidden></p>

      <button type="submit" class="btn-primary btn-large" id="reset-submit">Simpan Password Baru</button>
    </form>

    <div id="reset-invalid" class="admin-auth-card glass-panel" hidden>
      <a href="../index.html" class="logo">NRA<span class="logo-dot">.</span></a>
      <h1>Link Tidak Valid</h1>
      <p class="admin-auth-subtitle">Link reset password ini sudah kedaluwarsa atau tidak valid. Minta link baru lewat halaman Lupa Password.</p>
      <a href="forgot-password.html" class="btn-primary btn-large" style="text-align:center; text-decoration:none; display:block;">Minta Link Baru</a>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../supabase-client.js"></script>
  <script>
    const form = document.getElementById('reset-form');
    const invalidCard = document.getElementById('reset-invalid');
    const errorEl = document.getElementById('reset-error');
    const submitBtn = document.getElementById('reset-submit');

    // Clicking the emailed link lands here with a recovery token in the URL;
    // supabase-js parses it automatically and fires this event once it has
    // set up a temporary "recovery" session we can use to set a new password.
    let recoveryReady = false;

    db.auth.onAuthStateChange((event) => {
      if (event === 'PASSWORD_RECOVERY') {
        recoveryReady = true;
        form.hidden = false;
        invalidCard.hidden = true;
      }
    });

    // If no recovery event fires shortly after load, the link was invalid/expired.
    setTimeout(() => {
      if (!recoveryReady) {
        form.hidden = true;
        invalidCard.hidden = false;
      }
    }, 2500);

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.hidden = true;

      const password = document.getElementById('password').value;
      const confirm = document.getElementById('password-confirm').value;

      if (password !== confirm) {
        errorEl.textContent = 'Password dan konfirmasi tidak sama.';
        errorEl.hidden = false;
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Menyimpan...';

      const { error } = await db.auth.updateUser({ password });

      submitBtn.disabled = false;
      submitBtn.textContent = 'Simpan Password Baru';

      if (error) {
        errorEl.textContent = 'Gagal menyimpan: ' + error.message;
        errorEl.hidden = false;
        return;
      }

      window.location.replace('dashboard.html');
    });
  </script>
</body>
</html>
