<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin Login | NRA</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <div class="grid-overlay"></div>

  <main class="admin-auth-wrapper">
    <form id="login-form" class="admin-auth-card glass-panel">
      <a href="../index.html" class="logo">NRA<span class="logo-dot">.</span></a>
      <h1>Admin Login</h1>
      <p class="admin-auth-subtitle">Masuk untuk mengelola konten website.</p>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" required autocomplete="username">

      <label for="password">Password</label>
      <input type="password" id="password" name="password" required autocomplete="current-password">

      <p id="login-error" class="admin-error" hidden></p>

      <button type="submit" class="btn-primary btn-large" id="login-submit">Masuk</button>
      <a href="forgot-password.html" class="admin-auth-link">Lupa password?</a>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../supabase-client.js"></script>
  <script>
    const form = document.getElementById('login-form');
    const errorEl = document.getElementById('login-error');
    const submitBtn = document.getElementById('login-submit');

    // Already logged in? go straight to dashboard.
    db.auth.getSession().then(({ data }) => {
      if (data.session) window.location.replace('dashboard.html');
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.hidden = true;
      submitBtn.disabled = true;
      submitBtn.textContent = 'Masuk...';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      const { error } = await db.auth.signInWithPassword({ email, password });

      if (error) {
        errorEl.textContent = 'Login gagal: email atau password salah.';
        errorEl.hidden = false;
        submitBtn.disabled = false;
        submitBtn.textContent = 'Masuk';
        return;
      }

      window.location.replace('dashboard.html');
    });
  </script>
</body>
</html>
