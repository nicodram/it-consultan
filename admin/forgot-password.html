<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Lupa Password | NRA Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <div class="grid-overlay"></div>

  <main class="admin-auth-wrapper">
    <form id="forgot-form" class="admin-auth-card glass-panel">
      <a href="../index.html" class="logo">NRA<span class="logo-dot">.</span></a>
      <h1>Lupa Password</h1>
      <p class="admin-auth-subtitle">Masukkan email admin, kami kirimkan link untuk membuat password baru.</p>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" required autocomplete="username">

      <p id="forgot-error" class="admin-error" hidden></p>
      <p id="forgot-success" class="admin-success" hidden>Kalau email itu terdaftar, link reset password sudah dikirim. Cek inbox (atau folder spam) di email Anda.</p>

      <button type="submit" class="btn-primary btn-large" id="forgot-submit">Kirim Link Reset</button>
      <a href="login.html" class="admin-auth-link">&larr; Kembali ke Login</a>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../supabase-client.js"></script>
  <script>
    const form = document.getElementById('forgot-form');
    const errorEl = document.getElementById('forgot-error');
    const successEl = document.getElementById('forgot-success');
    const submitBtn = document.getElementById('forgot-submit');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.hidden = true;
      successEl.hidden = true;
      submitBtn.disabled = true;
      submitBtn.textContent = 'Mengirim...';

      const email = document.getElementById('email').value.trim();
      const redirectTo = new URL('reset-password.html', window.location.href).href;

      const { error } = await db.auth.resetPasswordForEmail(email, { redirectTo });

      submitBtn.disabled = false;
      submitBtn.textContent = 'Kirim Link Reset';

      if (error) {
        errorEl.textContent = 'Gagal mengirim: ' + error.message;
        errorEl.hidden = false;
        return;
      }

      // Always show the same success message regardless of whether the email
      // exists, so this form can't be used to check which emails are registered.
      successEl.hidden = false;
      form.querySelector('input').value = '';
    });
  </script>
</body>
</html>
