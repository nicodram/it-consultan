  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="script.js"></script>
  <script>
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str ?? '';
      return div.innerHTML;
    }

    async function loadArticle() {
      const contentEl = document.getElementById('article-content');
      const slug = new URLSearchParams(window.location.search).get('slug');

      if (!slug) {
        contentEl.innerHTML = '<p class="article-empty">Artikel tidak ditemukan.</p>';
        return;
      }

      const { data, error } = await db
        .from('articles')
        .select('title, content, cover_image_url, created_at')
        .eq('slug', slug)
        .eq('published', true)
        .single();

      if (error || !data) {
        contentEl.innerHTML = '<p class="article-empty">Artikel tidak ditemukan.</p>';
        return;
      }

      document.getElementById('page-title').textContent = data.title + ' | NRA';
      const dateStr = new Date(data.created_at).toLocaleDateString('id-ID', { year: 'numeric', month: 'long', day: 'numeric' });

      contentEl.innerHTML = `
        <article class="article-full glass-panel">
          ${data.cover_image_url ? `<div class="article-full-cover" style="background-image:url('${data.cover_image_url.replace(/'/g, "%27")}')"></div>` : ''}
          <span class="article-card-date">${dateStr}</span>
          <h1>${escapeHtml(data.title)}</h1>
          <div class="article-body">${marked.parse(data.content || '')}</div>
        </article>
      `;
    }

    loadArticle();
  </script>
